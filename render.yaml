services:
  - type: web
    name: order-sync
    runtime: python
    plan: free
    buildCommand: "pip install -r requirements.txt"
    startCommand: "uvicorn app.main:app --host 0.0.0.0 --port 10000"
    envVars:
      - key: ORDERS_SOURCE_URL
        value: https://test.ooobs.ru/api/orders
      - key: REQUEST_TIMEOUT
        value: "10"
      - key: LOG_LEVEL
        value: INFO
